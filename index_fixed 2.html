<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Money Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--card:#171c26;--line:#262d3a;--or:#ff6a00;--tx:#f0f4ff;--mu:#8b94a5;--gn:#22c55e;--rd:#ef4444;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'Inter',system-ui,sans-serif;min-height:100vh}
header{background:#05080e;border-bottom:2px solid var(--or);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:19px;letter-spacing:1px;font-weight:900}
header h1 b{color:var(--or)}
#sync-st{font-size:11px;font-family:monospace;color:var(--mu)}
.sync-refreshing{color:var(--or);display:inline-flex;align-items:center;gap:5px}
.sync-refreshing::before{content:'';width:7px;height:7px;border:1.5px solid var(--or);border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav{display:flex;gap:5px;overflow-x:auto;padding:8px 12px;background:#05080e;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--mu);text-decoration:none;padding:6px 12px;border-radius:99px;white-space:nowrap;font-weight:600;font-size:13px;transition:color .15s;flex-shrink:0}
nav a.on{background:var(--or);color:#fff}
nav a:hover:not(.on){color:var(--tx)}
#cache-banner{display:none;background:rgba(255,106,0,.08);border-bottom:1px solid rgba(255,106,0,.2);padding:6px 16px;font-size:11px;color:var(--or);align-items:center;gap:8px}
#cache-banner button{background:none;border:none;color:var(--or);cursor:pointer;text-decoration:underline;font-size:11px;padding:0 4px}
main{max-width:980px;margin:0 auto;padding:14px;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;color:var(--or);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
h3{font-size:13px;font-weight:700;color:var(--or);letter-spacing:.04em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mu);display:block;font-size:11px;margin-bottom:2px}
.stat b{font-size:18px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mu);font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
select,input,textarea,button{background:#0f141d;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--or);outline-offset:2px}
button{background:var(--or);border:0;font-weight:700;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
button.g{background:#1e2535}
button.sm{padding:5px 10px;font-size:12px}
.bar{height:20px;border-radius:5px;background:linear-gradient(90deg,var(--or),#ff9a4d);min-width:2px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.row span:first-child{width:88px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.warn{border-left:3px solid var(--or);background:#1d1a14;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.info{border-left:3px solid var(--gn);background:#111d16;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.gn{color:var(--gn)}.rd{color:var(--rd)}.mu{color:var(--mu)}.or{color:var(--or)}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;font-family:monospace}
.bw{background:rgba(34,197,94,.12);color:var(--gn)}
.bl{background:rgba(239,68,68,.12);color:var(--rd)}
.bb{background:rgba(162,87,255,.15);color:#c07aff}
.bk{background:rgba(139,148,165,.2);color:var(--mu)}
.ends-row{display:flex;align-items:center;gap:5px;font-size:11px;margin:4px 0;flex-wrap:wrap}
.ends-lbl{font-weight:700;color:var(--mu);font-size:10px;letter-spacing:.04em}
.ends-cd{color:var(--or);font-family:monospace;font-weight:700}
.ends-cd.expired{color:var(--rd)}
.lock-ban{display:flex;align-items:center;gap:6px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--rd);margin-bottom:8px}
.bet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px}
.bet-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.pick-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.pick-row:last-child{border:none}
.pick-team{color:var(--or);font-weight:700}
.pick-amt{color:var(--mu);font-family:monospace;font-size:11px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:4px;letter-spacing:.03em}
.fg input,.fg select,.fg textarea{width:100%}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alert{padding:8px 12px;border-radius:8px;font-size:12px;margin-top:8px}
.ok{background:rgba(34,197,94,.12);color:var(--gn);border:1px solid rgba(34,197,94,.2)}
.err{background:rgba(239,68,68,.12);color:var(--rd);border:1px solid rgba(239,68,68,.2)}
.inf{background:rgba(255,106,0,.1);color:var(--or);border:1px solid rgba(255,106,0,.2)}
.lt{font-family:monospace;font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px}
.lt-r{background:rgba(34,197,94,.12);color:var(--gn)}
.lt-b{background:rgba(162,87,255,.15);color:#c07aff}
.lt-k{background:rgba(255,106,0,.12);color:var(--or)}
.lt-i{background:rgba(239,68,68,.12);color:var(--rd)}
.lt-n{background:rgba(139,148,165,.1);color:var(--mu)}
.loading{text-align:center;padding:60px 20px;color:var(--mu)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--or);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.lw{max-height:300px;overflow-y:auto}
@media(max-width:640px){.ag{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>THE <b>MONEY</b> BOARD</h1>
  <span id="sync-st"></span>
</header>
<div id="cache-banner" style="display:none"></div>
<nav id="nav"></nav>
<main id="app" aria-live="polite"></main>
<script>
// ── CONSTANTS ───────────────────────────────────────────────────
const URL_='https://script.google.com/macros/s/AKfycbw2JrGe-6rI3bUVuOzGJAUEViTKafYyoYeAY11ZJeTjEFDEakDJBceXGKWn-utGRNJlFg/exec';
// Admin hash is verified server-side via GAS ping — no hard-coded constant needed.
const PAGES=[['home','Home'],['stand','Standings'],['heis','Heisman'],['week','This Week'],
  ['catchup','Catch-Up'],['h2h','Head-to-Head'],['bets','Bets'],['proj','Projections'],
  ['charts','Charts'],['sports','Sports'],['hist','History'],['admin','Admin']];
const CC=['#ff6a00','#22c55e','#38bdf8','#ef4444','#a78bfa','#facc15','#f472b6','#2dd4bf','#fb923c','#94a3b8','#84cc16','#e879f9'];
const CK='cfbmb2';const CF=2*60*1000;const CX=30*60*1000;

// ── STATE ────────────────────────────────────────────────────────
let ADMIN=false,pendingResolve=null;
let state={data:null,adminPw:'',adminLog:null};
let sortK='b',ca={a:null,b:null,ga:0,gb:0},hh={a:null,b:null},pj={d:{}},bt={i:0,w:null};
let _cd=null,savedScenarios=JSON.parse(localStorage.getItem('cfb_sc')||'[]');

// ── CACHE ────────────────────────────────────────────────────────
const Cache={
  get(){try{const r=localStorage.getItem(CK);if(!r)return null;const{data,ts}=JSON.parse(r);const age=Date.now()-ts;return{data,age,fresh:age<CF,expired:age>CX}}catch{return null}},
  set(d){try{localStorage.setItem(CK,JSON.stringify({data:d,ts:Date.now()}))}catch{}},
  clear(){try{localStorage.removeItem(CK)}catch{}}
};
const fmtAge=ms=>{const s=Math.floor(ms/1000);return s<60?s+'s ago':Math.floor(s/60)<60?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago'};

// ── API ──────────────────────────────────────────────────────────
function fetchT(url,opts={},ms=10000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t))}
async function apiGet(action){
  const delays=[0,2000,4000];let le;
  for(let i=0;i<delays.length;i++){
    if(delays[i])await new Promise(r=>setTimeout(r,delays[i]));
    try{const res=await fetchT(`${URL_}?action=${action}`,{redirect:'follow'});const txt=await res.text();return JSON.parse(txt)}
    catch(e){le=e.name==='AbortError'?new Error('Request timed out'):e}
  }throw le;
}
async function apiPost(action,payload){
  const body=JSON.stringify({action,password:state.adminPw,...payload});
  const res=await fetchT(URL_,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body},15000);
  return JSON.parse(await res.text());
}

// ── LOAD ─────────────────────────────────────────────────────────
// These stages mirror what getAllData() actually does in GAS so the
// user sees what's really happening, not random filler text.
const LOAD_STAGES=[
  {t:0,    pct:8,  label:'Connecting to Google Sheets…'},
  {t:550,  pct:18, label:'Reading config & season settings…'},
  {t:1050, pct:32, label:'Loading participant balances…'},
  {t:1600, pct:48, label:'Fetching bet sheets (Bet 1–7, Bonus, Local)…'},
  {t:2300, pct:63, label:'Building standings & win/loss history…'},
  {t:3000, pct:76, label:'Loading weekly balance snapshots…'},
  {t:3600, pct:87, label:'Fetching ESPN game data…'},
  {t:4200, pct:95, label:'Running bet validation checks…'},
  {t:4700, pct:99, label:'Packaging data for the site…'},
];
let _loadTimers=[];
function startLoadingSteps(){
  _loadTimers.forEach(clearTimeout);_loadTimers=[];
  const done=[];
  LOAD_STAGES.forEach((s,i)=>{
    const id=setTimeout(()=>{
      const bar=document.getElementById('ld-bar');
      const cur=document.getElementById('ld-cur');
      const hist=document.getElementById('ld-hist');
      if(!bar)return;
      bar.style.width=s.pct+'%';
      if(cur)cur.textContent=s.label;
      // Show last 4 completed steps as a mini-log
      if(i>0){done.push(LOAD_STAGES[i-1].label);}
      if(hist)hist.innerHTML=done.slice(-4).map(l=>`<div>✓ ${l}</div>`).join('');
    },s.t);
    _loadTimers.push(id);
  });
}
function stopLoadingSteps(){_loadTimers.forEach(clearTimeout);_loadTimers=[];}
function showLoadingScreen(){
  document.getElementById('app').innerHTML=`
    <div class="loading" id="ld-wrap" style="padding:50px 20px">
      <div class="spinner"></div>
      <div style="font-size:15px;font-weight:700;color:var(--tx);margin-bottom:6px">Loading The Money Board</div>
      <div id="ld-cur" style="font-size:12px;color:var(--or);margin-bottom:14px;min-height:16px">Connecting to Google Sheets…</div>
      <div style="width:260px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 16px">
        <div id="ld-bar" style="height:100%;background:var(--or);border-radius:3px;width:5%;transition:width .45s ease"></div>
      </div>
      <div id="ld-hist" style="font-size:11px;color:var(--mu);text-align:left;display:inline-block;min-width:280px;line-height:1.9"></div>
    </div>`;
  startLoadingSteps();
}
async function loadData(force=false){
  const cached=Cache.get();
  if(cached&&!force&&!cached.expired){
    state.data=cached.data;go();setSS(null);
    if(!cached.fresh){setSS('refreshing','Refreshing…');bgRef();}
    return;
  }
  if(!cached)showLoadingScreen();
  setSS('refreshing','Loading…');
  try{
    const data=await apiGet('getAll');
    if(data.error)throw new Error(data.error);
    stopLoadingSteps();
    state.data=data;Cache.set(data);hideBan();go();setSS(null);
  }catch(e){
    stopLoadingSteps();setSS(null);
    if(cached){state.data=cached.data;showBan(`Cached data from ${fmtAge(cached.age)}`,()=>loadData(true));go();}
    else document.getElementById('app').innerHTML=`<div class="card"><div class="alert err">${esc(e.message)}</div><br><button onclick="loadData(true)">⟳ Retry</button></div>`;
  }
}
async function bgRef(){
  try{const d=await apiGet('getAll');if(d.error)throw new Error(d.error);state.data=d;Cache.set(d);hideBan();go();setSS(null);}
  catch{setSS(null);document.getElementById('sync-st').innerHTML=`<span class="mu" style="font-size:11px">cached ${fmtAge(Cache.get()?.age||0)}</span>`;}
}
function setSS(cls,txt){const el=document.getElementById('sync-st');if(!el)return;el.innerHTML=cls?`<span class="sync-${cls}">${txt}</span>`:'';}
function showBan(msg,fn){const b=document.getElementById('cache-banner');if(!b)return;b.style.display='flex';b.innerHTML=`⚠ ${msg} <button onclick="(${fn.toString()})()">Force refresh</button>`;}
function hideBan(){const b=document.getElementById('cache-banner');if(b)b.style.display='none';}

// ── ADMIN AUTH ───────────────────────────────────────────────────
async function login(){
  const pw=qs('#pw')?.value;if(!pw)return;
  setElH('#pe','Verifying…');
  // Verify against GAS — it is the only authoritative source of the hash.
  // This eliminates the AH constant that caused "Error: auth" when the two drifted.
  try{
    state.adminPw=pw;
    const r=await apiPost('ping',{});
    if(r&&r.ok){ADMIN=true;go();}
    else{state.adminPw='';setElH('#pe','Wrong passcode.');}
  }catch(e){state.adminPw='';setElH('#pe','Could not reach server: '+e.message);}
}
function logout(){ADMIN=false;state.adminPw='';go();}

// ── FORMAT ───────────────────────────────────────────────────────
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n*100)/100).toLocaleString();
const sg=n=>n>0?`<span class="gn">▲ ${$$(n)}</span>`:n<0?`<span class="rd">▼ ${$$(-n)}</span>`:'<span class="mu">–</span>';
const pc=n=>n==null?'<span class="mu">n/a</span>':`<span class="${n>=0?'gn':'rd'}">${n>0?'+':''}${n.toFixed(1)}%</span>`;
const fmtD=n=>(n>0?'+':'−')+'$'+Math.abs(n).toLocaleString();
const noD=()=>'<div class="card"><h2>No data</h2><p class="mu">Still loading or connection failed.</p><button onclick="loadData(true)">⟳ Retry</button></div>';

// ── DATA HELPERS ─────────────────────────────────────────────────
function getHist(name){
  const snaps=(state.data?.snapshots||[]).filter(s=>s.participant===name).sort((a,b)=>a.week-b.week).map(s=>s.balance);
  const p=(state.data?.standings||[]).find(s=>s.name===name);
  if(p&&(!snaps.length||snaps[snaps.length-1]!==p.balance))snaps.push(p.balance);
  return snaps.length?snaps:[p?.balance||0];
}
function calc(){
  const L=(state.data?.standings||[]).map(p=>{
    const hist=getHist(p.name),b=p.balance,pv=hist.length>1?hist[hist.length-2]:null;
    const d=pv==null?0:b-pv,pct=pv==null||pv===0?null:(b-pv)/Math.abs(pv)*100;
    const imp=b-hist[0];
    return{...p,id:p.name,b,pv,d,pct,imp,hist};
  });
  const s=[...L].sort((a,b)=>b.b-a.b);L.forEach(p=>{p.rk=s.findIndex(x=>x.id===p.id)+1;});
  L.sort((a,b)=>a.rk-b.rk);
  const ps=[...L].sort((a,b)=>(b.pv??b.b)-(a.pv??a.b));L.forEach(p=>{p.prk=ps.findIndex(x=>x.id===p.id)+1;});
  L.forEach((p,i)=>{p.behind=L[0].b-p.b;p.ahead=i<L.length-1?p.b-L[i+1].b:null;});
  return L;
}
function projRows(d){const q=calc().map(p=>({...p,b:p.b+(d[p.id]||0)}));q.sort((a,b)=>b.b-a.b);q.forEach((p,i)=>{p.nr=i+1;});return q;}
function parsePay(str,amt){
  if(!str)return amt;
  // Check multiplier FIRST so "x1.5 money" doesn't get swallowed by the digit regex below
  const m=str.match(/x([\d.]+)/i);if(m)return Math.round(amt*(parseFloat(m[1])-1));
  // Flat payout: winner gets their stake back PLUS the bonus (e.g. bet $5k + bonus $5k = +$10k)
  const f=str.match(/(?:\+\$?|\$)([\d,]+)/);if(f)return amt+parseInt(f[1].replace(/,/g,''));
  return amt;
}
function mkOpts(L,sel){return L.map(p=>`<option value="${esc(p.id)}"${p.id===sel?' selected':''}>${esc(p.name)}</option>`).join('');}
// Pick the correct payout string by matching the winning team name inside it.
// Falls back to index-based logic only if neither string contains the winner name.
function pickPayout(winner,pa,pb){
  if(!winner)return pa||pb;
  const w=winner.toLowerCase();
  if((pa||'').toLowerCase().includes(w))return pa;
  if((pb||'').toLowerCase().includes(w))return pb;
  // Fallback: original index-based behaviour
  return pa;
}

// ── BET BUDGET VALIDATION ─────────────────────────────────────────
// Computed client-side from already-loaded data so it's instant and
// always current. Mirrors the logic in the GAS computeBetValidation().
function calcBetValidation(){
  const bets=state.data?.currentBets||[];
  const standings=state.data?.standings||[];
  // If the server already sent betValidation, use it; otherwise compute here
  if(state.data?.betValidation?.length)return state.data.betValidation;
  const totals={};
  standings.forEach(p=>{totals[p.name.toLowerCase()]={name:p.name,balance:p.balance,totalBet:0,betsDetail:[]};});
  bets.forEach(bet=>{
    if(bet.isLocked)return;
    (bet.bets||[]).forEach(b=>{
      const key=(b.participant||'').trim().toLowerCase();
      const row=totals[key];if(!row)return;
      row.totalBet+=(b.amount||0);
      row.betsDetail.push({betTitle:bet.title,amount:b.amount||0});
    });
  });
  return Object.keys(totals).map(k=>{
    const p=totals[k];
    return{name:p.name,balance:p.balance,totalBet:p.totalBet,
      isOver:p.totalBet>p.balance,
      overage:Math.max(0,p.totalBet-p.balance),
      remaining:p.balance-p.totalBet,betsDetail:p.betsDetail};
  }).sort((a,b)=>(b.isOver-a.isOver)||b.totalBet-a.totalBet);
}

// ── SVG LINE CHART ────────────────────────────────────────────────
function lineChart(series,labels){
  const all=series.flatMap(s=>s.v);if(!all.length)return '<p class="mu">No data yet.</p>';
  const mx=Math.max(...all),mn=Math.min(...all);
  const n=Math.max(...series.map(s=>s.v.length));
  const W=580,H=200,P=38;
  const X=i=>P+(n<2?W/2-P:i*(W-2*P)/(n-1));
  const Y=v=>H-P-(mx===mn?.5:(v-mn)/(mx-mn))*(H-2*P);
  const fmt=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'k':v.toFixed(0);
  let ya='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;ya+=`<line x1="${P}" y1="${Y(v)}" x2="${W-P}" y2="${Y(v)}" stroke="#262d3a"/><text x="${P-4}" y="${Y(v)+4}" text-anchor="end" fill="#8b94a5" font-size="10">${fmt(v)}</text>`;}
  let xl='';if(labels)labels.forEach((l,i)=>{xl+=`<text x="${X(i)}" y="${H-P+14}" text-anchor="middle" fill="#8b94a5" font-size="10">${esc(String(l))}</text>`;});
  const paths=series.map((s,si)=>{const col=CC[si%CC.length];const pts=s.v.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');const dots=s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${col}"/>`).join('');return`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;});
  const leg=series.length>1?`<div style="margin-bottom:6px">${series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#8b94a5;margin-right:10px"><span style="width:14px;height:3px;background:${CC[si%CC.length]};display:inline-block;border-radius:2px"></span>${esc(s.n)}</span>`).join('')}</div>`:'';
  return`<div style="overflow-x:auto">${leg}<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="min-width:280px">${ya}${xl}${paths.join('')}</svg></div>`;
}

// ── PAGES ────────────────────────────────────────────────────────
const P={};

P.home=()=>{
  const L=calc();if(!L.length)return noD();
  const t=L.reduce((s,p)=>s+p.b,0);
  const gs=[...L].sort((a,b)=>b.d-a.d);
  const cl=(()=>{let c=null;for(let i=0;i<L.length-1;i++){const g=L[i].b-L[i+1].b;if(g>0&&(!c||g<c.g))c={a:L[i],b:L[i+1],g};}return c;})();
  const big=L[0].b;
  const snap=state.data?.snapshots||[];
  const weeks=[...new Set(snap.map(s=>s.week))].sort((a,b)=>a-b);
  const top5=L.slice(0,5).map(p=>({n:p.name,v:snap.filter(s=>s.participant===p.name).sort((a,b)=>a.week-b.week).map(s=>s.balance)})).filter(d=>d.v.length>0);
  return`
  <div class="grid">
    <div class="stat"><small>Total in play</small><b>${$$(t)}</b></div>
    <div class="stat"><small>Average</small><b>${$$(t/L.length)}</b></div>
    <div class="stat"><small>Leader</small><b>${esc(L[0].name)}</b><small>${$$(L[0].b)}</small></div>
    <div class="stat"><small>Closest race</small><b>${cl?esc(cl.a.name)+' vs '+esc(cl.b.name):'–'}</b>${cl?`<small>${$$(cl.g)} gap</small>`:''}</div>
    <div class="stat"><small>Biggest gain</small><b>${esc(gs[0].name)}</b>${sg(gs[0].d)}</div>
    <div class="stat"><small>Season ends</small><b id="hcd">–</b></div>
  </div>
  <div class="card"><h2>Standings</h2>
    ${L.map(p=>`<div class="row"><span>${p.rk<=3?['🥇','🥈','🥉'][p.rk-1]:p.rk+'.'} ${esc(p.name)}${p.status==='inactive'?' <span class="mu" style="font-size:10px">[off]</span>':''}</span>
      <div class="bar" style="width:${Math.max(p.b/big*55,1)}%;${p.b<0?'background:var(--rd)':''}"></div>
      <b>${$$(p.b)}</b>${sg(p.d)}</div>`).join('')}
  </div>
  ${top5.length?`<div class="card"><h2>Balance History (Top 5)</h2>${lineChart(top5,weeks.map(w=>'Wk '+w))}</div>`:'<div class="card"><h2>Balance History</h2><p class="mu">No snapshots yet. Admin → Save Week Snapshot at the end of each week.</p></div>'}`;
};

function parseConfigDate(str){
  // "2026-12-30 19:00:00" has no TZ marker so browsers disagree: Chrome=local, FF/Safari=UTC.
  // Normalise to explicit ISO 8601 with no TZ so it's always parsed as local time.
  if(!str)return new Date('');
  return new Date(String(str).replace(' ','T'));
}
function startHCD(){
  const el=document.getElementById('hcd');if(!el)return;
  const e=parseConfigDate(state.data?.config?.season_end);
  if(isNaN(e)){el.textContent='–';return;}
  const tick=()=>{const diff=e-Date.now();if(diff<=0){el.textContent='Ended';return;}const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000);el.textContent=`${d}d ${h}h`;setTimeout(tick,60000);};tick();
}

P.week=()=>{
  const bets=state.data?.currentBets||[];const cfg=state.data?.config||{};
  if(!bets.length)return noD();
  // _cd is managed by the router (go()); do not clear it here or the timer freezes on re-render
  const TL={game:'GAME',prop:'PLAYER PROP',bonus:'BONUS BET',local:'LOCAL BET'};

  // ── Bet Budget Check panel ─────────────────────────────────────
  const vd=calcBetValidation();
  const overList=vd.filter(v=>v.isOver);
  const budgetPanel=(()=>{
    if(!vd.length)return'';
    // Determine if any bets are even open this week
    const openBets=bets.filter(b=>!b.isLocked);
    if(!openBets.length)return'';
    const rows=vd.filter(v=>v.totalBet>0||v.isOver).map(v=>{
      const pct=v.balance>0?Math.min(100,Math.round(v.totalBet/v.balance*100)):100;
      const barCol=v.isOver?'var(--rd)':pct>=75?'#facc15':'var(--gn)';
      const statusBadge=v.isOver
        ?`<span class="badge bl">OVER ${$$(v.overage)}</span>`
        :pct>=75?`<span class="badge" style="background:rgba(250,204,21,.12);color:#facc15">HIGH</span>`
        :`<span class="badge bw">OK</span>`;
      return`<tr>
        <td><b>${esc(v.name)}</b></td>
        <td style="font-family:monospace">${$$(v.balance)}</td>
        <td style="font-family:monospace">${$$(v.totalBet)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="flex:1;height:6px;background:var(--line);border-radius:3px;min-width:50px">
              <div style="width:${pct}%;height:100%;background:${barCol};border-radius:3px;transition:width .3s"></div>
            </div>
            <span style="font-size:11px;color:var(--mu);font-family:monospace;width:28px;text-align:right">${pct}%</span>
          </div>
        </td>
        <td>${statusBadge}</td>
        <td style="font-family:monospace;font-size:12px;color:${v.isOver?'var(--rd)':v.remaining<0?'var(--rd)':'var(--gn)'}">${$$(v.remaining)}</td>
      </tr>`;
    }).join('');
    const alertBanner=overList.length
      ?`<div class="alert err" style="margin-bottom:10px">⚠️ <b>${overList.length} participant${overList.length>1?'s are':' is'} over budget</b> — ${overList.map(v=>esc(v.name)+' ('+$$(v.overage)+' over)').join(', ')}</div>`
      :`<div class="alert ok" style="margin-bottom:10px">✅ All participants are within their budget.</div>`;
    return`<div class="card" style="margin-bottom:12px">
      <h2>💰 Bet Budget Check — Week ${cfg.current_week||'?'}</h2>
      ${alertBanner}
      <div class="tw"><table>
        <tr><th>Name</th><th>Balance</th><th>Staked</th><th>Usage</th><th>Status</th><th>Remaining</th></tr>
        ${rows}
      </table></div>
      <p class="mu" style="font-size:11px;margin-top:8px">Only open (unlocked) bets are counted. Staking more than your balance makes bets invalid.</p>
    </div>`;
  })();

  return budgetPanel+`<div class="warn">All bets lock <b>${cfg.week_lock_time||'Friday at 7:00 PM'}</b> · Week ${cfg.current_week||'?'}</div>
  <div class="bet-grid">${bets.map(bet=>{
    const lim=[bet.entryMin?'Entry: '+$$(bet.entryMin):'',bet.betMax?'Max: '+$$(bet.betMax):''].filter(Boolean).join(' · ');
    const pays=[bet.payoutA,bet.payoutB].filter(Boolean).join(' / ');
    const overSet=new Set(calcBetValidation().filter(v=>v.isOver).map(v=>v.name.toLowerCase()));
    const picks=(bet.bets||[]).map(b=>{
      const isOv=overSet.has((b.participant||'').toLowerCase());
      return`<div class="pick-row" style="${isOv?'background:rgba(239,68,68,.07);border-radius:5px;':''}">
        <span>${esc(b.participant)}${isOv?' <span style="font-size:10px;color:var(--rd);font-weight:700">⚠ OVER</span>':''}</span>
        <span class="pick-team">${esc(b.pick)}</span>
        <span class="pick-amt">${b.amount?$$(b.amount):'–'}</span>
      </div>`;}).join('');
    const ends=bet.endsAt?`<div class="ends-row"><span class="ends-lbl">ENDS</span><span class="mu">${new Date(bet.endsAt).toLocaleDateString('en-US',{month:'numeric',day:'numeric'})} at ${new Date(bet.endsAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span><span class="ends-cd" data-ends="${bet.endsAt}">...</span></div>`:'';
    return`<div class="bet-card">${bet.isLocked?'<div class="lock-ban">🔒 LOCKED</div>':''}<span class="mu" style="font-size:10px;font-weight:700;letter-spacing:.06em">${TL[bet.betType]||'BET'}</span><div style="font-weight:700;font-size:14px;margin:2px 0">${esc(bet.title||'–')}</div><div class="mu" style="font-size:11px;font-family:monospace">${lim}</div>${ends}${pays?`<div class="mu" style="font-size:11px;background:#0f141d;padding:5px 8px;border-radius:6px;margin:5px 0">${pays}</div>`:''}
      <div class="mu" style="font-size:11px;margin-bottom:3px">${(bet.bets||[]).length} bets placed</div>
      ${picks||'<div class="mu" style="font-size:12px">No bets placed</div>'}
    </div>`;}).join('')}</div>`;
};

function tickCDs(){document.querySelectorAll('.ends-cd').forEach(el=>{const d=new Date(el.dataset.ends).getTime()-Date.now();if(d<=0){el.textContent='CLOSED';el.classList.add('expired');return;}const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);el.textContent=h>24?`${Math.floor(h/24)}d ${h%24}h`:`${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;});}

P.catchup=()=>{
  const L=calc();if(L.length<2)return L.length?'<div class="card">Need 2+ participants.</div>':noD();
  ca.a=ca.a||L[0].id;ca.b=ca.b||L[1].id;
  const A=L.find(p=>p.id===ca.a),B=L.find(p=>p.id===ca.b);if(!A||!B)return'';
  const hi=A.b>=B.b?A:B,lo=hi===A?B:A,gap=hi.b-lo.b;
  return`<div class="warn">Hypothetical only — not predictions or guarantees.</div>
  <div class="card"><h2>Catch-Up Calculator</h2>
    <div class="f"><select onchange="ca.a=this.value;go()">${mkOpts(L,ca.a)}</select>
      vs <select onchange="ca.b=this.value;go()">${mkOpts(L,ca.b)}</select></div>
    <p>${gap===0?`Tied at <b>${$$(hi.b)}</b>.`:`Gap: <b>${$$(gap)}</b> (${((gap/Math.abs(hi.b))*100).toFixed(1)}% of ${esc(hi.name)}'s balance)</p>
      <p><b>${esc(lo.name)}</b> needs to gain <b>${$$(gap)}</b> to tie</p>
      <p><b>${esc(hi.name)}</b> can lose up to <b>${$$(gap)}</b> before being tied`}
    </p>
    <p id="ch" class="mu" style="font-size:12px;margin-top:8px"></p>
  </div>
  <div class="card"><h2>What if…</h2>
    <div class="f">
      <label>${esc(lo.name)} gains <input type="number" min="0" style="width:110px" value="${lo===A?ca.ga:ca.gb}" oninput="${lo===A?'ca.ga':'ca.gb'}=Math.max(0,+this.value||0);upd()"></label>
      <label>${esc(hi.name)} loses <input type="number" min="0" style="width:110px" value="${hi===A?ca.ga:ca.gb}" oninput="${hi===A?'ca.ga':'ca.gb'}=Math.max(0,+this.value||0);upd()"></label>
    </div>
    <p id="cr"></p>
  </div>
  ${A.hist.length>2?`<div class="card"><h2>Balance History</h2>${lineChart([{n:A.name,v:A.hist},{n:B.name,v:B.hist}])}</div>`:''}`;
};

function chance(){
  const L=calc(),A=L.find(p=>p.id===ca.a),B=L.find(p=>p.id===ca.b);if(!A||!B)return;
  const hi=A.b>=B.b?A:B,lo=hi===A?B:A;
  const d=h=>h.slice(1).map((v,i)=>v-h[i]);
  const dh=d(hi.hist),dl=d(lo.hist);
  const el=document.getElementById('ch');if(!el)return;
  if(dh.length<2||dl.length<2){el.innerHTML='Need at least 3 snapshots for each to estimate.';return;}
  const pk=a=>a[Math.floor(Math.random()*a.length)];
  let w={1:0,3:0,5:0};
  for(let t=0;t<4000;t++){let x=lo.b,y=hi.b;for(let r=1;r<=5;r++){x+=pk(dl);y+=pk(dh);if([1,3,5].includes(r)&&x>y)w[r]++;}}
  el.innerHTML=`Catch-up odds for <b>${esc(lo.name)}</b>: ${[1,3,5].map(r=>Math.round(w[r]/40)+'% in '+r+' round'+(r>1?'s':'')).join(' · ')} <span class="mu">(rough simulation only)</span>`;
}

function upd(){
  chance();
  const L=calc(),A=L.find(p=>p.id===ca.a),B=L.find(p=>p.id===ca.b);if(!A||!B)return;
  const hi=A.b>=B.b?A:B,lo=hi===A?B:A,g=lo===A?ca.ga:ca.gb,l=hi===A?ca.ga:ca.gb;
  const n=lo.b+g-(hi.b-l);const el=document.getElementById('cr');if(!el)return;
  el.innerHTML=n>0?`<b class="gn">${esc(lo.name)} leads by ${$$(n)}</b>`:n===0?'<b>Tied</b>':`<b class="rd">${esc(hi.name)} still leads by ${$$(-n)}</b>`;
}

  const w=A.b===B.b?null:A.b>B.b?A:B;

  return`<div class="card"><h2>Head-to-Head</h2>
    <div class="f"><select onchange="hh.a=this.value;go()">${mkOpts(L,hh.a)}</select>

      <tr><td>Correct bets</td><td class="gn">${A.correctBets||0}</td><td class="gn">${B.correctBets||0}</td></tr>
      <tr><td>Accuracy</td><td>${A.accuracy||0}%</td><td>${B.accuracy||0}%</td></tr>

};

P.bets=()=>{
  const L=calc();if(!L.length)return noD();
  const bets=state.data?.currentBets||[];if(!bets.length)return'<div class="card"><h2>No bets loaded</h2><p class="mu">No bets found in the Google Sheet.</p></div>';
  if(bt.i>=bets.length)bt.i=0;
  const B=bets[bt.i];
  const ks=[...new Set((B.bets||[]).map(p=>p.pick).filter(Boolean))];
  // h is a fully self-contained card — always closed, no dangling div
  const h=`<div class="warn">Hypothetical only — not predictions or guarantees.</div>
  <div class="card"><h2>Bet What-If</h2>
    <div class="f"><select onchange="bt.i=+this.value;bt.w=null;go()">
      ${bets.map((b,i)=>`<option value="${i}"${i===bt.i?' selected':''}>${esc(b.title||b.sheetName||'Bet '+(i+1))}${b.isLocked?' 🔒':''}</option>`).join('')}
    </select></div>
    ${B.endsAt?`<p class="mu" style="font-size:12px">Ends: ${new Date(B.endsAt).toLocaleString('en-US',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})}</p>`:''}
    <div class="f">${ks.map(k=>`<button class="${bt.w===k?'':'g'}" data-pick="${esc(k)}" onclick="bt.w=this.dataset.pick;go()">If ${esc(k)} wins</button>`).join('')}</div>
  </div>`;
  if(!bt.w)return h;
  const payWin=pickPayout(bt.w,B.payoutA,B.payoutB);
  const results=(B.bets||[]).map(b=>{const isW=b.pick===bt.w;return{...b,isW,change:isW?parsePay(payWin,b.amount):-(b.amount||0)};});
  const delta={};results.forEach(r=>{const p=L.find(x=>x.name.toLowerCase().trim()===r.participant.toLowerCase().trim());if(p)delta[p.id]=(delta[p.id]||0)+r.change;});
  const proj=projRows(delta);
  const wins=results.filter(r=>r.isW),losses=results.filter(r=>!r.isW);
  const totalOut=wins.reduce((s,r)=>s+r.change,0);
  const totalIn=losses.reduce((s,r)=>s+Math.abs(r.change),0);
  return h+`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px">
      <h2 style="margin:0">If <span style="color:var(--or)">${esc(bt.w)}</span> wins</h2>
      <span class="mu" style="font-size:12px">${wins.length} winner${wins.length!==1?'s':''} · ${losses.length} loser${losses.length!==1?'s':''}</span>
    </div>
    <div class="tw"><table>
      <tr><th>Name</th><th>Pick</th><th>Staked</th><th>Outcome</th><th>Payout</th></tr>
      ${results.map(r=>`<tr>
        <td><b>${esc(r.participant)}</b></td>
        <td style="color:${r.isW?'var(--gn)':'var(--mu)'}"><b>${esc(r.pick)}</b></td>
        <td style="font-family:monospace;color:var(--mu)">${$$(r.amount)}</td>
        <td><span class="badge ${r.isW?'bw':'bl'}">${r.isW?'WIN ✓':'LOSS'}</span></td>
        <td><b class="${r.isW?'gn':'rd'}">${r.isW?'+':'−'}${$$(Math.abs(r.change))}</b></td>
      </tr>`).join('')}
    </table></div>
    <div style="display:flex;gap:16px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap">
      ${payWin?`<span class="mu">Rule: <b style="color:var(--tx)">${esc(payWin)}</b></span>`:''}
      ${totalOut?`<span class="gn">Paid out: <b>+${$$(totalOut)}</b></span>`:''}
      ${totalIn?`<span class="rd">Forfeited: <b>−${$$(totalIn)}</b></span>`:''}
    </div>
  </div>
  <div class="card"><h2>Projected Standings if ${esc(bt.w)} wins</h2>
    <div class="tw"><table>

P.charts=()=>{

  return`<div class="card"><h2>Balance Over Time</h2>

function renderPC(name){
  const el=document.getElementById('pc-wrap');if(!el||!name){if(el)el.innerHTML='';return;}
  const snap=(state.data?.snapshots||[]).filter(s=>s.participant===name).sort((a,b)=>a.week-b.week);
  const hist=(state.data?.history||[]).filter(r=>r.participant===name);
  const wnet={};hist.forEach(r=>{wnet[r.week]=(wnet[r.week]||0)+r.amount_change;});
  const wks=Object.keys(wnet).map(Number).sort((a,b)=>a-b);
  const cards=[...hist].sort((a,b)=>b.week-a.week).map(r=>{
    const iw=r.outcome==='win';
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px">
      <span>${esc(r.bet_id||'–')} <span class="mu" style="font-size:11px">Wk ${r.week}</span></span>
      <span class="badge ${iw?'bw':'bl'}">${iw?'WIN':'LOSS'}</span>
      <b class="${iw?'gn':'rd'}">${sg(r.amount_change)}</b>
    </div>`;}).join('');
  el.innerHTML=`${snap.length?`<h2 style="font-size:13px;margin-bottom:8px">Balance History</h2>${lineChart([{n:name,v:snap.map(s=>s.balance)}],snap.map(s=>'Wk '+s.week))}`:'<p class="mu">No snapshot history yet.</p>'}
    ${wks.length?`<h2 style="font-size:13px;margin:12px 0 6px">Weekly Net Change</h2>
      <div class="tw"><table><tr><th>Week</th><th>Net</th></tr>${wks.map(w=>`<tr><td>Wk ${w}</td><td class="${wnet[w]>=0?'gn':'rd'}">${sg(wnet[w])}</td></tr>`).join('')}</table></div>`:''}
    ${hist.length?`<h2 style="font-size:13px;margin:12px 0 6px">Bet History</h2>${cards}`:'<p class="mu">No resolved bet history yet.</p>'}`;
}

async function addGame(){
  const a=qs('#ga')?.value.trim(),b=qs('#gb')?.value.trim(),p=parseFloat(qs('#gp')?.value),ra=parseInt(qs('#gra')?.value)||0,rb=parseInt(qs('#grb')?.value)||0;
  if(!a||!b){setMsg('gm','Team A and B required.','err');return;}
  const games=[...(state.data?.games||[])];
  games.push({id:'G_'+Date.now(),teamA:a,teamB:b,rankA:ra,rankB:rb,probA:isNaN(p)?null:p,probB:isNaN(p)?null:Math.round((100-p)*10)/10,source:'ESPN, entered by admin'});
  await svGames(games);
}
async function delGame(i){if(!confirm('Remove this game?'))return;const g=[...(state.data?.games||[])];g.splice(i,1);await svGames(g);}
async function clearGames(){if(!confirm('Clear all games?'))return;await svGames([]);}
async function svGames(games){
  setMsg('gm','Saving…','inf');
  try{const r=await apiPost('saveGames',{games});if(r.error)throw new Error(r.error);if(state.data)state.data.games=games;Cache.clear();go();}
  catch(e){setMsg('gm','Error: '+e.message,'err');}
}

    el.innerHTML=log.length?`<div class="lw"><table><tr><th>Time</th><th>Type</th><th>Name</th><th>Change</th><th>Ref</th><th>Notes</th></tr>

}

// ── BET VALIDATION ACTIONS ────────────────────────────────────────
function runValidation(){
  const el=document.getElementById('a-vlout');if(!el)return;
  const vd=calcBetValidation();
  if(!vd.length){el.innerHTML='<div class="alert inf">No participant data loaded.</div>';return;}
  const overList=vd.filter(v=>v.isOver);
  const banner=overList.length
    ?`<div class="alert err" style="margin-bottom:8px">⚠️ <b>${overList.length} participant${overList.length>1?'s are':' is'} over budget.</b></div>`
    :`<div class="alert ok" style="margin-bottom:8px">✅ All participants are within budget.</div>`;
  const rows=vd.filter(v=>v.totalBet>0||v.isOver).map(v=>{
    const pct=v.balance>0?Math.min(100,Math.round(v.totalBet/v.balance*100)):100;
    return`<tr style="${v.isOver?'background:rgba(239,68,68,.08)':''}">
      <td><b>${esc(v.name)}</b></td>
      <td style="font-family:monospace">${$$(v.balance)}</td>
      <td style="font-family:monospace">${$$(v.totalBet)}</td>
      <td style="font-family:monospace;color:${v.isOver?'var(--rd)':'var(--gn)'}">${$$(v.remaining)}</td>
      <td><span class="badge ${v.isOver?'bl':'bw'}">${v.isOver?'OVER '+$$(v.overage):'OK'}</span></td>
      ${v.isOver?`<td class="mu" style="font-size:11px">${v.betsDetail.map(d=>esc(d.betTitle||'')+'  '+$$(d.amount)).join('<br>')}</td>`:'<td></td>'}
    </tr>`;}).join('');
  const noAction=vd.filter(v=>v.totalBet===0).map(v=>`<span class="mu" style="font-size:11px">${esc(v.name)}</span>`).join(', ');
  el.innerHTML=banner+(rows?`<div class="tw"><table>
    <tr><th>Name</th><th>Balance</th><th>Staked</th><th>Remaining</th><th>Status</th><th>Breakdown</th></tr>
    ${rows}
  </table></div>`:'')+(noAction?`<p class="mu" style="font-size:11px;margin-top:8px">No bets placed yet: ${noAction}</p>`:'');
}
async function submitHighlight(){
  const el=document.getElementById('a-vlout');const btn=document.getElementById('a-hlbtn');
  if(el)el.innerHTML='<div class="alert inf">Running server-side validation and updating sheet…</div>';
  if(btn)btn.disabled=true;
  try{
    const r=await apiPost('highlightOverBettors',{});
    if(r.error)throw new Error(r.error);
    const msg=r.overCount>0
      ?`✅ Colored <b>${r.overCount}</b> over-budget participant(s) red across <b>${r.highlighted}</b> rows in the bet sheets.`
      :`✅ All participants are within budget — rows colored green in the bet sheets.`;
    if(el)el.innerHTML=`<div class="alert ok">${msg}</div>`;
    // Also refresh local display
    runValidation();
  }catch(e){if(el)el.innerHTML=`<div class="alert err">Error: ${esc(e.message)}</div>`;}
  finally{if(btn)btn.disabled=false;}
}

function exportCSV(){
  const L=calc();
  csvDown([['Rank','Name','Balance','Change','Correct','Incorrect','Accuracy','Heisman','Status'],
    ...L.map((p,i)=>[i+1,p.name,p.b,p.d,p.correctBets||0,p.incorrectBets||0,(p.accuracy||0)+'%',p.heismanScore||0,p.status])],'money_board.csv');
}
function exportLog(){
  if(!state.adminLog?.length){alert('Load the admin log first.');return;}
  csvDown([['Timestamp','Type','Participant','Week','Reference','Change','Notes'],
    ...state.adminLog.map(r=>[r.timestamp,r.type,r.participant,r.week,r.reference,r.amount_change,r.notes||''])],'admin_log.csv');
}
function csvDown(rows,name){
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();
}

function go(){
  if(_cd){clearInterval(_cd);_cd=null;}
  const h=(location.hash||'#home').slice(1);
  const pg=P[h]?h:'home';
  document.getElementById('nav').innerHTML=PAGES.map(([id,lbl])=>
    `<a href="#${id}"${id===pg?' class="on" aria-current="page"':''}>${lbl}${id==='admin'&&ADMIN?' 🔐':''}</a>`).join('');
  document.getElementById('app').innerHTML=P[pg]();
  if(pg==='home')startHCD();
  if(pg==='week'){_cd=setInterval(tickCDs,1000);tickCDs();}
  if(pg==='catchup'&&calc().length>1){chance();upd();}
  if(pg==='proj'&&calc().length)pr();
}
